<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 808 292" width="808" height="292" role="img" aria-labelledby="t d"><title id="t">Nota y aviso</title><desc id="d">Dos bloques de llamada: nota con barra blanca y aviso con borde naranja, triángulo y trama</desc><style>text{font-family:'Fira Code','DejaVu Sans Mono',ui-monospace,monospace;font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}</style><rect width="808" height="292" fill="#0A0A0C"/><text x="24" y="28" font-size="11" font-weight="400" fill="#9A9AA5" letter-spacing="0.9">NOTA · BARRA BLANCA</text><rect x="24" y="44" width="760" height="82" fill="#101013"/><rect x="24" y="44" width="4" height="82" fill="#F2F2F0"/><text x="50" y="70" font-size="13" font-weight="500" fill="#F2F2F0">Nota</text><text x="50" y="94" font-size="14" font-weight="400" fill="#C2C2CB">Una nota aporta contexto. Se reconoce por la barra blanca, no por el color.</text><text x="50" y="114" font-size="14" font-weight="400" fill="#C2C2CB">Nunca lleva naranja.</text><text x="24" y="160" font-size="11" font-weight="400" fill="#9A9AA5" letter-spacing="0.9">AVISO · BORDE NARANJA + TRIÁNGULO + TRAMA (EL SIGNIFICADO NO DEPENDE DEL COLOR)</text><rect x="24.7" y="176.7" width="758.6" height="88.6" fill="none" stroke="#E8621C" stroke-width="1.4"/><path d="M25 187L33 179L33 184L30 187Z M25 182L30 177L25 177Z M25 197L33 189L33 194L30 197Z M25 192L30 187L25 187Z M25 207L33 199L33 204L30 207Z M25 202L30 197L25 197Z M25 217L33 209L33 214L30 217Z M25 212L30 207L25 207Z M25 227L33 219L33 224L30 227Z M25 222L30 217L25 217Z M25 237L33 229L33 234L30 237Z M25 232L30 227L25 227Z M25 247L33 239L33 244L30 247Z M25 242L30 237L25 237Z M25 257L33 249L33 254L30 257Z M25 252L30 247L25 247Z M25 267L33 259L33 264L30 267Z M25 262L30 257L25 257Z " fill="#E8621C"/><polygon points="56,182 71,210 41,210" fill="#E8621C"/><text x="56" y="208" font-size="14" font-weight="500" fill="#0A0A0C" text-anchor="middle">!</text><text x="92" y="200" font-size="13" font-weight="500" fill="#F2F2F0">Ojo</text><text x="92" y="224" font-size="14" font-weight="400" fill="#C2C2CB">Un aviso marca el error típico del tema. Lleva triángulo y trama rayada,</text><text x="92" y="244" font-size="14" font-weight="400" fill="#C2C2CB">de modo que se reconoce aunque se imprima en blanco y negro.</text></svg>
