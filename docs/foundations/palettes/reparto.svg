<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 232" width="880" height="232" role="img" aria-labelledby="t d"><title id="t">Reparto de color</title><desc id="d">Proporción orientativa de superficie por color: el naranja nunca supera el 3 %</desc><style>text{font-family:'Fira Code','DejaVu Sans Mono',ui-monospace,monospace;font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}</style><rect width="880" height="232" fill="#0A0A0C"/><text x="24" y="36" font-size="12" font-weight="500" fill="#F2F2F0" letter-spacing="2.4">REPARTO DE SUPERFICIE</text><line x1="24" y1="46" x2="856" y2="46" stroke="#4A4A55" stroke-width="1"/><rect x="24" y="66" width="516" height="54" fill="#0A0A0C" stroke="#34343C" stroke-width="1"/><text x="24" y="146" font-size="13" font-weight="500" fill="#F2F2F0">62 %</text><text x="24" y="164" font-size="11" font-weight="400" fill="#9A9AA5">Fondo y paneles</text><rect x="540" y="66" width="200" height="54" fill="#F2F2F0"/><text x="540" y="146" font-size="13" font-weight="500" fill="#F2F2F0">24 %</text><text x="540" y="164" font-size="11" font-weight="400" fill="#9A9AA5">Blanco: estructura y texto</text><rect x="740" y="66" width="92" height="54" fill="#6E6E78"/><text x="740" y="146" font-size="13" font-weight="500" fill="#F2F2F0">11 %</text><text x="740" y="164" font-size="11" font-weight="400" fill="#9A9AA5">Grises: línea y secundarios</text><rect x="832" y="66" width="25" height="54" fill="#E8621C"/><text x="832" y="146" font-size="13" font-weight="500" fill="#F2F2F0">3 %</text><text x="832" y="164" font-size="11" font-weight="400" fill="#9A9AA5">Naranja: señal</text><text x="24" y="206" font-size="12.5" font-weight="400" fill="#C2C2CB">Regla: por cada elemento naranja, al menos tres en blanco o gris.</text></svg>
